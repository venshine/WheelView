plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace = 'com.wx.wheelview'
    compileSdk = 36

    defaultConfig {
        minSdk = 14
        // 不强制使用方把 compileSdk 升到与本库一致
        aarMetadata {
            minCompileSdk = 21
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

kotlin {
    // 使用方会传递依赖 kotlin-stdlib：固定用 Kotlin 2.2.10 开发，stdlib 和元数据版本不随 AGP 内置的编译器升级，
    // 避免使用方对 Kotlin 版本的要求被悄悄抬高
    coreLibrariesVersion = '2.2.10'
    compilerOptions {
        languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_2
        apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_2
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

dependencies {
    api 'androidx.annotation:annotation:1.11.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.viewpager:viewpager:1.1.0'
}

// 通过 JitPack 发布：com.github.venshine:WheelView:<tag>
publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.github.venshine'
            artifactId = 'WheelView'
            version = '3.0.0'

            afterEvaluate {
                from components.release
            }
        }
    }
}
